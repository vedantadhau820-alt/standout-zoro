<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#05070A">

    <title>Monthly Drop — Stand Out</title>

    <!-- Existing StandOut theme -->
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/buttons.css">

    <!-- Drop page -->
    <link rel="stylesheet" href="CSS/drop-info.css">
</head>

<body class="drop-page">

    <main class="drop-screen">

        <!-- =================================================
             CINEMATIC BACKGROUND
        ================================================== -->

        <div class="drop-background"></div>
        <div class="drop-overlay"></div>

        <!-- Ambient glow -->
        <div class="drop-glow drop-glow-one"></div>
        <div class="drop-glow drop-glow-two"></div>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="drop-content">

            <!-- TOP LABEL -->

            <div class="drop-label">

                <span class="drop-line"></span>

                <span class="drop-label-text">
                    MONTHLY DROP
                </span>

                <span class="drop-diamond"></span>

            </div>


            <!-- DROP TITLE -->

            <div class="drop-title-area">

                <h1 id="dropName">
                    THE CURSED ERA
                </h1>

                <p id="dropMonth" class="drop-month">
                    OCTOBER 2026
                </p>

            </div>


            <!-- DESCRIPTION -->

            <p id="dropDescription" class="drop-description">
                A new month. A new challenge.
            </p>


            <!-- =================================================
                 DROP CONTENT TAGS
            ================================================== -->

            <div class="drop-tags">

                <div class="drop-tag">
                    <span class="tag-symbol">◆</span>
                    <span>NEW SEASON</span>
                </div>

                <div class="drop-tag">
                    <span class="tag-symbol">✦</span>
                    <span>NEW REWARDS</span>
                </div>

                <div class="drop-tag">
                    <span class="tag-symbol">◈</span>
                    <span>NEW BADGE</span>
                </div>

            </div>


            <!-- =================================================
                 EXPIRY
            ================================================== -->

            <div class="drop-expiry">

                <span class="expiry-label">
                    AVAILABLE UNTIL
                </span>

                <span class="expiry-line"></span>

                <strong id="dropExpiry">
                    OCTOBER 31, 2026
                </strong>

            </div>


            <!-- =================================================
                 CONTINUE
            ================================================== -->

            <button
                id="dropContinue"
                class="drop-continue"
                type="button"
            >

                <span>
                    CONTINUE
                </span>

                <span class="continue-arrow">
                    →
                </span>

            </button>

        </section>


        <!-- =================================================
             DECORATIVE ELEMENTS
        ================================================== -->

        <div class="drop-corner corner-top-left"></div>
        <div class="drop-corner corner-top-right"></div>
        <div class="drop-corner corner-bottom-left"></div>
        <div class="drop-corner corner-bottom-right"></div>

    </main>


    <!-- Existing Drop JavaScript -->
    <script src="JS/drop-info.js"></script>

</body>
</html>
